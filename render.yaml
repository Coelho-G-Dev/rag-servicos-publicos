# ==============================================================================
# RENDER BLUEPRINT (render.yaml) - 100% GRATUITO / SEM CARTÃO DE CRÉDITO
# Orquestração para o projeto rag-servicos-publicos utilizando PostgreSQL
# gratuito do Neon.tech / Supabase (pgvector nativo).
# ==============================================================================

services:
  # --- AI Service (FastAPI + pgvector + all-MiniLM-L6-v2 + Gemini) ---
  - type: web
    name: rag-ai-service
    env: docker
    dockerContext: ./ai-service
    dockerfilePath: ./ai-service/Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: DATABASE_URL
        sync: false
      - key: INTERNAL_API_SECRET
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_NAME
        value: gemini-2.5-flash
      - key: EMBEDDING_MODEL_NAME
        value: all-MiniLM-L6-v2
      - key: TOP_K_RESULTS
        value: "4"
      - key: LOG_LEVEL
        value: INFO

  # --- Gateway Público (Express + TypeScript + Swagger UI) ---
  - type: web
    name: rag-gateway
    env: node
    rootDir: gateway
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromService:
          type: web
          name: rag-ai-service
          envVarKey: DATABASE_URL
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: rag-ai-service
          property: host
      - key: INTERNAL_API_SECRET
        fromService:
          type: web
          name: rag-ai-service
          envVarKey: INTERNAL_API_SECRET
      - key: RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: RATE_LIMIT_MAX
        value: "100"
